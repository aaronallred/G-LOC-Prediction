data_path: C:\Users\savan\gloc_prediction_wyatt\G-LOC-Prediction\data\
shared_data_parameters:
  subject_to_analyze: null
  trial_to_analyze: null
  analysis_type: 2
  remove_NaN_trials: false
  impute_file_name: imputed_data.pkl
  save_impute: false
  load_impute: false
  impute_phase: none
  output_feature_dtype: float32
  train_data_filename: all_trials_25_hz_downselected.csv
  eval_data_filename: all_new_trials_25_hz_stacked_with_afe.csv
  exclude_streams: ["ECG Lead 2"] #to exclude all ECG lead 2 streams, since extended data has a lot of missing values for this stream
advanced_data_parameters:
  n_neighbors: 4
  baseline_window: 32.5
  horizon: 0
traditional_data_parameters:
  backstep: 0
  data_rate: 25
  offset: 0
  time_start: 0
  standardize_s1: true

sensor_ablation:
  training:
    enabled: true
    save_results_folder: Results/Sensor_Ablation_with_ECG2
    median_hyperparameters_folder: Results/Cross_Validation
    median_hyperparameters_model_type: !ModelType [ Complete, Explicit ]
    # Mode-specific parameters
    models: [XGB, KNN, EGB, RF]
    model_type: !ModelType [ Complete, Common ]
    manual_ablation: true
    random_seed: 42
    num_splits: 1
    class_weight: null  # null, "balanced", or a dict like {0: 1.0, 1: 2.0}
    streams:
        - [ECG, BR, Temperature, Centrifuge]
      # - [ EEG ]
      # - [ EEG, Pupil ]
      # - [ EEG, Pupil, Participant ]