data_path: data
shared_data_parameters:
  subject_to_analyze: null
  trial_to_analyze: null
  analysis_type: 2
  remove_NaN_trials: true
  impute_file_name: imputed_data.pkl
  save_impute: false
  load_impute: false
  impute_phase: pre_feature
  output_feature_dtype: float32
advanced_data_parameters:
  n_neighbors: 4
  baseline_window: 32.5
  horizon: 0
traditional_data_parameters:
  backstep: 0
  data_rate: 25
  offset: 0
  time_start: 0

real_time_equivital:
  enabled: true
  # Mirrors sensor_ablation.training so saved fold models align with the rebuilt test set.
  model_type: !ModelType [ Complete, Explicit ]
  random_seed: 42
  models: [ EGB, KNN, RF ]
  num_splits: 10
  streams:
    - [ ECG, Centrifuge ]
  manual_ablation: true
  class_weight: null
  saved_models_folder: Results/Sensor_Ablation_Real_Time
  save_results_folder: Results/Real_Time_Prediction_Latency
  use_real_time_sleep: false
